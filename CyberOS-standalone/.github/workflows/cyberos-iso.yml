name: CyberOS ISO
on:
  push:
    paths:
      - "CyberOS-standalone/**"
      - ".github/workflows/cyberos-iso.yml"
  workflow_dispatch:
    inputs:
      nvidia:
        description: Include NVIDIA packages
        required: false
        default: "false"
permissions:
  contents: read
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build CyberOS in Arch container
        env:
          CYBEROS_NVIDIA: ${{ github.event.inputs.nvidia || 'false' }}
        run: |
          docker run --rm --privileged \
            -e CYBEROS_NVIDIA="$CYBEROS_NVIDIA" \
            -v "$PWD/CyberOS-standalone:/src" \
            -w /src archlinux:latest bash -lc './build.sh'
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-ISO
          path: |
            CyberOS-standalone/out/*.iso
            CyberOS-standalone/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
