name: CyberOS ISO

on:
  push:
    paths:
      - "CyberOS-standalone/**"
      - "Dockerfile"
      - ".github/workflows/cyberos-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate CyberOS profile
        run: bash CyberOS-standalone/tests/run-tests.sh

      - name: Build CyberOS Docker image
        run: docker build --pull -t cyberos-builder .

      - name: Build ISO with CyberOS Docker image
        run: |
          mkdir -p "$PWD/CyberOS-standalone/out"
          docker run --rm --privileged \
            -v "$PWD/CyberOS-standalone/out:/workspace/out" \
            cyberos-builder

      - name: Verify ISO output
        run: |
          test -s CyberOS-standalone/out/SHA256SUMS
          ls -lh CyberOS-standalone/out/*.iso
          cat CyberOS-standalone/out/SHA256SUMS

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-ISO
          path: |
            CyberOS-standalone/out/*.iso
            CyberOS-standalone/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
